name: Sync Yungching Branches Inventory

on:
  schedule:
    # 每天五次：台灣時間 08:00, 11:00, 14:00, 17:00, 20:00 (對應 UTC 00:00, 03:00, 06:00, 09:00, 12:00)
    - cron: '0 0,3,6,9,12 * * *'
  workflow_dispatch: # 支援手動一鍵觸發

jobs:
  sync:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'runner/requirements.txt'

      - name: Install Dependencies
        run: |
          pip install -q requests

      - name: Run Branch Sync Script
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python sync_branches.py
