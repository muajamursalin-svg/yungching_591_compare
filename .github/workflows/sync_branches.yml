name: Sync Yungching Branches Inventory

on:
  schedule:
    # 每天五次：台灣時間 08:00, 11:00, 14:00, 17:00, 20:00 (對應 UTC 00:00, 03:00, 06:00, 09:00, 12:00)
    - cron: '0 0,3,6,9,12 * * *'
  workflow_dispatch: # 支援手動一鍵觸發

jobs:
  sync:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Branch Sync Script
        shell: powershell
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          $pyRoot = Join-Path $env:RUNNER_TOOL_CACHE "py312"
          $pyExe = Join-Path $pyRoot "tools\python.exe"
          if (-not (Test-Path $pyExe)) {
            Write-Host "Installing standalone Python 3.12.8 to $pyRoot..."
            New-Item -ItemType Directory -Path $pyRoot -Force | Out-Null
            $zip = Join-Path $pyRoot "py.zip"
            Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/python/3.12.8" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $pyRoot -Force
            Remove-Item $zip -Force
          }
          & $pyExe -c "import requests" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Installing dependencies..."
            & $pyExe -m pip install --no-warn-script-location -q -r runner/requirements.txt
          }
          & $pyExe sync_branches.py
