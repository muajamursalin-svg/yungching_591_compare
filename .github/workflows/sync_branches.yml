name: Sync Yungching Branches Inventory

on:
  schedule:
    # 每天五次：台灣時間 08:00, 11:00, 14:00, 17:00, 20:00 (對應 UTC 00:00, 03:00, 06:00, 09:00, 12:00)
    - cron: '0 0,3,6,9,12 * * *'
  workflow_dispatch: # 支援手動一鍵觸發

jobs:
  sync:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Branch Sync Script
        shell: powershell
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          $py = (Get-Command python -ErrorAction SilentlyContinue | Where-Object { $_.Source -notlike '*WindowsApps*' } | Select-Object -First 1 -ExpandProperty Source)
          if (-not $py) {
            $py = Get-ChildItem -Path "C:\Program Files\Python*", "C:\Python*", "C:\Users\*\AppData\Local\Programs\Python\Python*" -Filter "python.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $py) { throw "Python executable not found on this server!" }
          Write-Host "Using Python: $py"
          & $py -c "import requests" 2>$null
          if ($LASTEXITCODE -ne 0) { & $py -m pip install -q requests }
          & $py sync_branches.py
