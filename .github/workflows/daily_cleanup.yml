name: Daily Database Cleanup (Retention 3 Days)

on:
  schedule:
    # 每天固定於台灣時間凌晨 03:00 執行 (對應 UTC 19:00)
    - cron: '0 19 * * *'
  workflow_dispatch: # 支援手動一鍵觸發測試

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Cleanup Task (Retention: 3 Days)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python cleanup_task.py 3
