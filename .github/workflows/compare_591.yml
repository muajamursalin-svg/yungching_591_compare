name: Multi-Platform Shop Inventory Comparison

on:
  repository_dispatch:
    types: [compare_591, compare_5168, compare_rakuya, compare_inventory]
  workflow_dispatch:
    inputs:
      shop_id:
        description: '店鋪 ID 或網址 (例如 591 broker12017、5168 或 樂屋網 https://vip.rakuya.com.tw/0937234338/)'
        required: true
        default: 'https://vip.rakuya.com.tw/0937234338/'
      user_id:
        description: 'LINE 使用者 ID (用於推播完成通知，選填)'
        required: false
        default: ''

jobs:
  compare:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Multi-Platform Crawler & Comparator
        shell: powershell
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LIFF_URL: ${{ secrets.LIFF_URL }}
          EVENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          WORKFLOW_INPUTS: ${{ toJson(github.event.inputs) }}
        run: |
          $pyRoot = Join-Path $env:RUNNER_TOOL_CACHE "py312"
          $pyExe = Join-Path $pyRoot "tools\python.exe"
          if (-not (Test-Path $pyExe)) {
            Write-Host "Installing standalone Python 3.12.8 to $pyRoot..."
            New-Item -ItemType Directory -Path $pyRoot -Force | Out-Null
            $zip = Join-Path $pyRoot "py.zip"
            Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/python/3.12.8" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $pyRoot -Force
            Remove-Item $zip -Force
          }
          & $pyExe -c "import requests, curl_cffi" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Installing dependencies..."
            & $pyExe -m pip install --no-warn-script-location -q -r runner/requirements.txt
          }
          & $pyExe run_compare_task.py
