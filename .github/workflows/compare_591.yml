name: Multi-Platform Shop Inventory Comparison

on:
  repository_dispatch:
    types: [compare_591, compare_5168, compare_rakuya, compare_inventory]
  workflow_dispatch:
    inputs:
      shop_id:
        description: '店鋪 ID 或網址 (例如 591 broker12017、5168 或 樂屋網 https://vip.rakuya.com.tw/0937234338/)'
        required: true
        default: 'https://vip.rakuya.com.tw/0937234338/'
      user_id:
        description: 'LINE 使用者 ID (用於推播完成通知，選填)'
        required: false
        default: ''

jobs:
  compare:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -q requests curl_cffi

      - name: Run Multi-Platform Crawler & Comparator
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LIFF_URL: ${{ secrets.LIFF_URL }}
          EVENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          WORKFLOW_INPUTS: ${{ toJson(github.event.inputs) }}
        run: |
          python run_compare_task.py
