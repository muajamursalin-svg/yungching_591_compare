name: Multi-Platform Shop Inventory Comparison

on:
  repository_dispatch:
    types: [compare_591, compare_5168, compare_inventory]
  workflow_dispatch:
    inputs:
      shop_id:
        description: '店鋪 ID 或網址 (例如 591 broker12017 或 5168 https://realtor.houseprice.tw/agent/buy/0968682023/)'
        required: true
        default: 'https://realtor.houseprice.tw/agent/buy/0968682023/'
      user_id:
        description: 'LINE 使用者 ID (用於推播完成通知，選填)'
        required: false
        default: ''

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Multi-Platform Crawler & Comparator
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          SHOP_INPUT: ${{ github.event.client_payload.shop_url || github.event.client_payload.shop_id || github.event.inputs.shop_id }}
          SHOP_URL: ${{ github.event.client_payload.shop_url || '' }}
          USER_ID: ${{ github.event.client_payload.user_id || github.event.inputs.user_id }}
          LIFF_URL: ${{ secrets.LIFF_URL }}
        run: |
          python run_compare_task.py
